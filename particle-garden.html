function updateSolar(dt,k){const T=positions.solar, n=BODIES.length, cs=new Float32Array(n), sn=new Float32Array(n);
 for(let b=0;b<n;b++){SPIN[b]+=dt*BODIES[b][5];cs[b]=Math.cos(SPIN[b]);sn[b]=Math.sin(SPIN[b])}
 for(let i=0;i<COUNT;i++){const j=i*3,b=solarBody[i],lx=solarLocal[j]*k,ly=solarLocal[j+1]*k,lz=solarLocal[j+2]*k;
  const x1=lx*cs[b]+lz*sn[b], z1=-lx*sn[b]+lz*cs[b];
  T[j]=BODIES[b][1]+x1;T[j+1]=ly*TILT_C[b]-z1*TILT_S[b];T[j+2]=ly*TILT_S[b]+z1*TILT_C[b]}}

let current=new Float32Array(positions.heart), geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(current,3).setUsage(THREE.DynamicDrawUsage));const colors=new Float32Array(COUNT*3),targetColors=new Float32Array(COUNT*3);geo.setAttribute('color',new THREE.BufferAttribute(colors,3).setUsage(THREE.DynamicDrawUsage));const sizes=new Float32Array(COUNT);for(let i=0;i<COUNT;i++)sizes[i]=1.5+rand(i,7)*2.5;geo.setAttribute('aSize',new THREE.BufferAttribute(sizes,1));geo.setDrawRange(0,START);
// uDepth：行星模型启用"远暗近亮" / profundidade: lado de trás mais escuro nos planetas
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,uniforms:{uPixelRatio:{value:renderer.getPixelRatio()},uOpacity:{value:1},uDepth:{value:0}},vertexShader:`attribute float aSize; varying vec3 vColor; varying float vFade; uniform float uPixelRatio; uniform float uDepth; void main(){vColor=color; vec4 mv=modelViewMatrix*vec4(position,1.0); float d=9.5+mv.z; vFade=mix(1.0,clamp(0.62+d*0.34,0.2,1.08),uDepth); gl_PointSize=aSize*uPixelRatio*(10.0/-mv.z); gl_Position=projectionMatrix*mv;}`,fragmentShader:`varying vec3 vColor; varying float vFade; uniform float uOpacity; void main(){float d=length(gl_PointCoord-0.5); if(d>0.5)discard; float glow=exp(-d*9.0); float core=smoothstep(.5,.08,d); gl_FragColor=vec4(vColor, (glow*.55+core*.85)*uOpacity*vFade);}`});const points=new THREE.Points(geo,mat);points.frustumCulled=false;group.add(points); // 太阳系模式会移动整组粒子，关闭视锥剔除 / evita que desapareçam ao mover a fila

/* ===================== 颜色 / Cores ===================== */
let userHex='#ff6688', natural=true;
function refreshColors(){const c=new THREE.Color(userHex), pal=palettes[active];
 for(let i=0;i<COUNT;i++){const j=i*3;
  if(pal){if(natural){const k=.93+rand(i,9)*.14;targetColors[j]=pal[j]*k;targetColors[j+1]=pal[j+1]*k;targetColors[j+2]=pal[j+2]*k}
   else{const lum=(.2126*pal[j]+.7152*pal[j+1]+.0722*pal[j+2])*2.3;targetColors[j]=c.r*lum;targetColors[j+1]=c.g*lum;targetColors[j+2]=c.b*lum}}
  else{let k=1.0+rand(i,9)*.42;targetColors[j]=c.r*k;targetColors[j+1]=c.g*k;targetColors[j+2]=c.b*k}}
 document.querySelector('#hexLabel').textContent=(pal&&natural)?'NATURAL':userHex.toUpperCase();
 document.querySelector('#naturalBtn').style.display=(pal&&!natural)?'inline-block':'none'}
function colorize(hex){userHex=hex;if(palettes[active])natural=false;refreshColors()}

models.forEach(([id,label,title,sub,emoji])=>{let b=document.createElement('button');b.className='model'+(id===active?' active':'')+(id==='solar'?' wide':'');b.innerHTML=`<span class="emoji">${emoji}</span>${label}`;b.onclick=()=>selectModel(id);grid.appendChild(b)});

/* ===================== 太阳系导航 / Navegação no Sistema Solar ===================== */
let solarBlend=0, panX=9.4, panTarget=9.4, focus=-1, scaleNow=1, infoLang='en';
const bar=document.querySelector('#planetBar');
BODIES.forEach((B,b)=>{const el=document.createElement('button');el.className='chip';el.innerHTML=`<i style="background:${B[6]}"></i><span></span>`;el.onclick=()=>focusTo(b);bar.appendChild(el)});
const L=()=>infoLang==='en'?0:1;
function focusTo(b){b=Math.max(0,Math.min(BODIES.length-1,b));panTarget=BODIES[b][1]}
function nearest(x){let best=0;BODIES.forEach((B,b)=>{if(Math.abs(B[1]-x)<Math.abs(BODIES[best][1]-x))best=b});return best}
function updateSolarUI(){bar.querySelectorAll('.chip').forEach((el,b)=>{el.classList.toggle('on',b===focus);el.querySelector('span').textContent=NAMES[BODIES[b][0]][L()]});
 if(active==='solar'&&focus>=0)document.querySelector('#shapeSub').textContent=`SOLAR SYSTEM · ${NAMES[BODIES[focus][0]][0].toUpperCase()}`}

function selectModel(id){const was=active;active=id;document.querySelectorAll('.model').forEach((b,i)=>b.classList.toggle('active',models[i][0]===id));let m=models.find(m=>m[0]===id);document.querySelector('#shapeTitle').textContent=m[2];document.querySelector('#shapeSub').textContent=m[3];natural=true;refreshColors();
 if(id==='solar'&&was!=='solar'){zoom=.55;panTarget=9.4;focus=-1;bar.classList.add('show');toast(infoLang==='en'?'Drag or ← → to travel · scroll or pinch to zoom · tap a planet below':'Arrasta ou ← → para viajar · roda ou pinça para zoom · toca num planeta em baixo')}
 if(id!=='solar'&&was==='solar'){zoom=1;bar.classList.remove('show')}
 renderInfo()}

/* ===================== 信息卡 / Cartão de informação ===================== */
function renderInfo(){updateChatCtx();const card=document.querySelector('#infoCard'), key=active==='solar'?BODIES[focus]?.[0]:(active==='jupiter'||active==='saturn')?active:null, d=INFO[key]?.[infoLang];
 if(!d){card.classList.remove('show');return}
 document.querySelector('#infoName').textContent=d.name;
 document.querySelector('#infoFacts').innerHTML=d.rows.map(([k,v])=>`<div class="fact"><span>${k}</span><b>${v}</b></div>`).join('');
 document.querySelector('#infoNote').textContent=d.note;
 document.querySelector('#naturalBtn').textContent=infoLang==='en'?'↺ Real colors':'↺ Cores reais';
 document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===infoLang));
 card.classList.remove('show');void card.offsetWidth;card.classList.add('show')}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{infoLang=b.dataset.lang;renderInfo();updateSolarUI();renderChatChrome()});
document.querySelector('#naturalBtn').onclick=()=>{natural=true;refreshColors()};


/* ===================== AI 太空向导 / Guia espacial com IA (Claude) =====================
   O browser só fala com /api/chat no nosso servidor; a chave da API fica no servidor (.env ou Vercel).
   Para trocar PT por ES: acrescentar "es" aqui e no INFO, e mudar o botão PT para ES no HTML. */
const UI={
 en:{btn:'Ask Stelar',title:'Ask Stelar · AI space guide',ctx:'Talking about',general:'the Solar System',hello:n=>`Hi! I'm Stelar, your space guide. Ask me anything about ${n}.`,now:n=>`Now: ${n}`,ph:'Ask a question…',
     sugg:['Tell me a fun fact','Could humans live there?','How did it form?'],
     err:{rate:'Too many questions at once. Wait a few seconds and try again.',config:'The chat is not set up yet: the server has no API key.',offline:'The chat needs the Stelar server. Run "npm start" or open the online version.',busy:'The AI is busy right now. Please try again.',bad:'Something went wrong with that message. Please try again.'}},
 pt:{btn:'Pergunta ao Stelar',title:'Pergunta ao Stelar · guia espacial IA',ctx:'A falar de',general:'o Sistema Solar',hello:n=>`Olá! Sou o Stelar, o teu guia espacial. Pergunta-me o que quiseres sobre ${n}.`,now:n=>`Agora: ${n}`,ph:'Escreve uma pergunta…',
     sugg:['Conta-me uma curiosidade','Os humanos podiam viver lá?','Como se formou?'],
     err:{rate:'Demasiadas perguntas seguidas. Espera uns segundos e tenta outra vez.',config:'O chat ainda não está configurado: falta a chave da API no servidor.',offline:'O chat precisa do servidor Stelar. Corre "npm start" ou abre a versão online.',busy:'A IA está ocupada agora. Tenta outra vez.',bad:'Algo correu mal com essa mensagem. Tenta outra vez.'}}
};
const T=()=>UI[infoLang]||UI.en;
const chatPanel=document.querySelector('#chatPanel'), chatLog=document.querySelector('#chatLog'), chatInput=document.querySelector('#chatInput'), chatSend=document.querySelector('#chatSend');
let chatMsgs=[], chatBusy=false, chatKeyNow=null;
function chatKey(){return active==='solar'?(BODIES[focus]?.[0]||'solar'):(active==='jupiter'||active==='saturn')?active:'solar'}
function chatName(k){return k==='solar'?T().general:NAMES[k][L()]}
function chatFacts(k){const d=INFO[k]?.en;if(!d)return 'Bodies in order from the Sun: Sun, Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune. In this app, sizes and distances are compressed.';return d.name+'\n'+d.rows.map(r=>r[0]+': '+r[1]).join('\n')+'\n'+d.note}
function addMsg(cls,text){const el=document.createElement('div');el.className='msg '+cls;el.textContent=text;chatLog.appendChild(el);chatLog.scrollTop=chatLog.scrollHeight;return el}
function renderChatChrome(){const t=T();document.querySelector('#chatBtnLabel').textContent=t.btn;document.querySelector('#chatTitle').textContent=t.title;chatInput.placeholder=t.ph;
 document.querySelector('#chatCtx').textContent=t.ctx+' · '+chatName(chatKey());
 const sg=document.querySelector('#chatSugg');sg.innerHTML='';t.sugg.forEach(q=>{const b=document.createElement('button');b.type='button';b.textContent=q;b.onclick=()=>askStelar(q);sg.appendChild(b)})}
function updateChatCtx(){const k=chatKey();if(k===chatKeyNow)return;const had=chatKeyNow!==null;chatKeyNow=k;
 if(had&&chatLog.childElementCount)addMsg('note',T().now(chatName(k)));renderChatChrome()}
function openChat(){chatPanel.classList.add('show');updateChatCtx();renderChatChrome();if(!chatLog.childElementCount)addMsg('bot',T().hello(chatName(chatKey())));setTimeout(()=>chatInput.focus(),50)}
document.querySelector('#chatBtn').onclick=()=>chatPanel.classList.contains('show')?chatPanel.classList.remove('show'):openChat();
document.querySelector('#chatClose').onclick=()=>chatPanel.classList.remove('show');
document.querySelector('#chatForm').addEventListener('submit',e=>{e.preventDefault();askStelar(chatInput.value)});
async function askStelar(text){text=String(text||'').trim().slice(0,500);if(!text||chatBusy)return;
 chatBusy=true;chatSend.disabled=true;chatInput.value='';addMsg('me',text);chatMsgs.push({role:'user',content:text});
 const wait=addMsg('bot','');wait.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
 const k=chatKey();let err=null;
 try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({planet:k,lang:infoLang,facts:chatFacts(k),messages:chatMsgs.slice(-8)})});
  let data={};try{data=await r.json()}catch{err=location.protocol==='file:'||r.status===404||r.status===501?'offline':'busy'}
  if(!err&&r.ok&&data.reply){wait.textContent=data.reply;chatMsgs.push({role:'assistant',content:data.reply})}
  else err=err||data.error||'busy';
 }catch(e){err='offline'}
 if(err){wait.remove();chatMsgs.pop();addMsg('err',T().err[err]||T().err.busy)}
 chatLog.scrollTop=chatLog.scrollHeight;chatBusy=false;chatSend.disabled=false}
renderChatChrome();
refreshColors();colors.set(targetColors);geo.attributes.color.needsUpdate=true;

const video=document.querySelector('#video');let landmarker=null,camStream=null,detectBusy=false;
async function startCamera(){const btn=document.querySelector('#cameraBtn');btn.disabled=true;btn.textContent='正在启动…';try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=camStream;await video.play();document.querySelector('#camPlaceholder').style.display='none';document.querySelector('#camState').textContent='加载模型…';const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20');const fileset=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/wasm');landmarker=await vision.HandLandmarker.createFromOptions(fileset,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1,minHandDetectionConfidence:.55,minHandPresenceConfidence:.5,minTrackingConfidence:.5});document.querySelector('#camState').textContent='已连接';document.querySelector('#liveDot').classList.add('on');document.querySelector('#liveText').textContent='手势追踪中';btn.textContent='关闭摄像头';btn.disabled=false;btn.onclick=stopCamera;toast('摄像头已开启，试着张开或握紧手掌');}catch(e){console.error(e);if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;document.querySelector('#camState').textContent='连接失败';btn.disabled=false;btn.textContent='重试摄像头';toast(e.name==='NotAllowedError'?'请允许浏览器访问摄像头': '摄像头启动失败，请使用 localhost 或 HTTPS 打开页面');}}
function stopCamera(){if(camStream)camStream.getTracks().forEach(t=>t.stop());camStream=null;landmarker=null;video.srcObject=null;document.querySelector('#camPlaceholder').style.display='grid';document.querySelector('#camState').textContent='未连接';document.querySelector('#liveDot').classList.remove('on');document.querySelector('#liveText').textContent='待机中';let b=document.querySelector('#cameraBtn');b.textContent='启用摄像头';b.onclick=startCamera;}
document.querySelector('#cameraBtn').onclick=startCamera;
function gestureTick(){if(!landmarker||video.readyState<2||detectBusy)return;detectBusy=true;try{const out=landmarker.detectForVideo(video,performance.now()),lm=out.landmarks?.[0];if(lm){handSeen=performance.now();const dist=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y);let palm=Math.max(.05,dist(0,9));let openness=[8,12,16,20].reduce((s,n)=>s+dist(n,0),0)/4/palm;gestureScale=THREE.MathUtils.clamp(.58+(openness-.9)*.52,.52,1.58);handX=1-lm[9].x;handY=lm[9].y;const indexUp=lm[8].y<lm[6].y-.025,middleDown=lm[12].y>lm[10].y,ringDown=lm[16].y>lm[14].y,pinkyDown=lm[20].y>lm[18].y;oneFinger=indexUp&&middleDown&&ringDown&&pinkyDown;let pinch=dist(4,8)/palm;
 const solar=active==='solar';
 // 太阳系模式：捏合缩放范围更大，单指左右移动＝沿轨道"飞行" / no Sistema Solar: zoom mais amplo e o dedo indicador desliza pela fila
 zoom=THREE.MathUtils.lerp(zoom,solar?THREE.MathUtils.clamp(.32+pinch*1.9,.32,3):THREE.MathUtils.clamp(.76+pinch*1.65,.7,1.55),.18);
 if(solar&&oneFinger)panTarget=cl((handX-.15)/.7)*PAN_MAX;
 spread=THREE.MathUtils.lerp(spread,THREE.MathUtils.clamp((openness-1)*.27,0,.5),.12);document.querySelector('#liveText').textContent=oneFinger?(solar?'单指平移':'单指旋转'):openness>1.6?'手掌扩散':'手掌聚合';}else{oneFinger=false}}catch(e){console.warn(e)}finally{detectBusy=false}}
function toast(s){let t=document.querySelector('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),s.length>40?4200:2400)}
document.querySelector('#colorPicker').addEventListener('input',e=>colorize(e.target.value));document.querySelector('#density').addEventListener('input',e=>{document.querySelector('#densityVal').textContent=Number(e.target.value).toLocaleString('en-US');let n=+e.target.value;points.geometry.setDrawRange(0,n)});
document.querySelector('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
window.addEventListener('keydown',e=>{if(e.target.closest?.('input,textarea'))return;if(e.key.toLowerCase()==='f')document.querySelector('#fullscreen').click();
 if(active==='solar'){const f=nearest(panTarget);if(e.key==='ArrowRight')focusTo(f+1);if(e.key==='ArrowLeft')focusTo(f-1)}});
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointerup',()=>{drag=false;if(active==='solar')focusTo(nearest(panTarget))});
renderer.domElement.addEventListener('pointermove',e=>{if(drag){if(active==='solar'){panTarget=Math.max(-.5,Math.min(PAN_MAX+.5,panTarget-(e.clientX-lastX)*.03/scaleNow))}else{rotY+=(e.clientX-lastX)*.006;rotX+=(e.clientY-lastY)*.006}lastX=e.clientX;lastY=e.clientY}});
renderer.domElement.addEventListener('wheel',e=>{const solar=active==='solar';zoom=THREE.MathUtils.clamp(zoom-e.deltaY*.001*(solar?1.6:1),solar?.3:.55,solar?3.2:1.8)},{passive:true});

let prev=performance.now(),spinAng=0;function animate(now){requestAnimationFrame(animate);gestureTick();let dt=Math.min(.04,(now-prev)/1000);prev=now;
 const solar=active==='solar';let influence=performance.now()-handSeen<5000?gestureScale:1;let spreadFactor=1+spread;
 if(solar)updateSolar(dt,influence*spreadFactor);
 const mult=solar?1:influence*spreadFactor;
 let target=positions[active],p=geo.attributes.position.array;let smooth=1-Math.exp(-dt*4);for(let i=0;i<COUNT;i++){let j=i*3;let jitter=(Math.sin(now*.0015+i*1.73)*.012+Math.cos(now*.0011+i*.51)*.01);for(let c=0;c<3;c++){let v=target[j+c]*mult;if(c===2)v+=jitter;p[j+c]+=(v-p[j+c])*smooth;colors[j+c]+=(targetColors[j+c]-colors[j+c])*smooth}}geo.attributes.position.needsUpdate=true;geo.attributes.color.needsUpdate=true;
 const planet=palettes[active]?1:0;mat.uniforms.uDepth.value+=(planet-mat.uniforms.uDepth.value)*smooth;
 spinAng=(spinAng+dt*.12*(solar?0:mat.uniforms.uDepth.value))%TAU; // 木星/土星单独显示时缓慢自转 / rotação lenta de Júpiter/Saturno sozinhos
 solarBlend+=((solar?1:0)-solarBlend)*smooth;panX+=(panTarget-panX)*smooth;
 if(solar){const f=nearest(panX);if(f!==focus){focus=f;renderInfo();updateSolarUI()}}
 const ny=wrapPI(rotY+spinAng+(oneFinger&&!solar?(handX-.5)*2.3:Math.sin(now*.00018)*.12)), nx=rotX+(oneFinger&&!solar?(handY-.5)*1.0:Math.sin(now*.00013)*.05);
 const sy=Math.sin(now*.00018)*.03, sx=.2+Math.sin(now*.00013)*.03; // 太阳系：略微俯视 / Sistema Solar: vista ligeiramente de cima
 group.rotation.y=ny+(sy-ny)*solarBlend;group.rotation.x=nx+(sx-nx)*solarBlend;
 scaleNow+=(zoom-scaleNow)*Math.min(1,smooth*1.6);group.scale.setScalar(scaleNow);
 group.position.x=-panX*scaleNow*solarBlend;
 renderer.render(scene,camera)}requestAnimationFrame(animate);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);mat.uniforms.uPixelRatio.value=renderer.getPixelRatio()});
</script></body></html>
